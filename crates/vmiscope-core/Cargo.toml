[package]
name = "vmiscope-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Reflective WMI engine: browse namespaces/classes, run WQL, read class schemas (properties, qualifiers, methods), execute methods, and monitor events — the core behind VMI-Scope."
readme = "README.md"
keywords = ["wmi", "windows", "wbem", "wql", "security"]
categories = ["os::windows-apis", "api-bindings"]

[dependencies]
anyhow.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# `Win32_Security` and `Win32_System_Threading` are both needed for one call:
# `OpenProcessToken` lives in `System::Threading` but is itself gated on
# `#[cfg(feature = "Win32_Security")]`, because its access-mask argument is a
# `Security::TOKEN_ACCESS_MASK`. Enabling either alone does not expose it.
# `Win32_Security_Authorization` adds `ConvertSidToStringSidW`, the fallback that
# keeps an unresolvable SID from rendering blank.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Rpc", "Win32_System_Threading", "Win32_System_Variant", "Win32_System_Wmi"] }
wmi = "0.18.4"

[[example]]
name = "probe"
path = "examples/probe.rs"
