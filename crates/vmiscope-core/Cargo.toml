[package]
name = "vmiscope-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Reflective WMI engine: browse namespaces/classes, run WQL, read class schemas (properties, qualifiers, methods), execute methods, and monitor events — the core behind VMI-Scope."
readme = "README.md"
keywords = ["wmi", "windows", "wbem", "wql", "security"]
categories = ["os::windows-apis", "api-bindings"]

[dependencies]
anyhow.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Wmi"] }
wmi = "0.18.4"

[[example]]
name = "probe"
path = "examples/probe.rs"
