[package]
name = "vmiscope-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VMI-Scope — egui desktop front-end"

[[bin]]
name = "vmiscope"
path = "src/main.rs"

[dependencies]
vmiscope-core = { path = "../vmiscope-core" }
anyhow.workspace = true
# `default_fonts` is deliberately off on both: it embeds ~1.4 MB of Hack,
# Ubuntu-Light and two emoji faces that theme::fonts replaces wholesale.
# Everything else in eframe's default set is kept.
#
# eframe's own default list contains "winit/default", which a downstream crate
# is not allowed to name. winit is therefore a direct dependency below, and
# feature unification turns those defaults back on -- they are the Linux
# windowing backends, so leaving them off would build here and break there.
eframe = { version = "0.35.0", default-features = false, features = [
    "accesskit",
    "wayland",
    "web_screen_reader",
    "wgpu",
    "x11",
] }
egui = { version = "0.35.0", default-features = false }
egui_extras = "0.35.0"
winit = "0.30.13"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
