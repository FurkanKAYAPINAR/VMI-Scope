# cargo-deny policy (task 7.13).
#
# Run `cargo deny check` to reproduce. The whole dependency graph is checked,
# not just the Windows slice: this crate builds on Linux too (eframe's winit
# backends are enabled deliberately -- see crates/vmiscope-gui/Cargo.toml), so a
# target filter here would hide real findings from a real build.

[advisories]
version = 2
yanked = "deny"

ignore = [
    # RUSTSEC-2026-0192 -- `ttf-parser` is unmaintained.
    #
    # Not a vulnerability: the advisory is `unmaintained`, and its own text says
    # "Solution: No safe upgrade is available!".
    #
    # It reaches this workspace by exactly one path, and it is worth reading:
    #
    #     ttf-parser -> owned_ttf_parser -> ab_glyph -> sctk-adwaita -> winit
    #
    # `sctk-adwaita` is winit's Wayland *client-side decorations* crate. It draws
    # a title bar on Linux under Wayland, and it parses a font to do it. So this
    # is not in the font path VMI-Scope uses -- `theme::fonts` goes through
    # egui, which rasterises with `skrifa` (the crate this advisory recommends as
    # the replacement) -- and it is not compiled at all on Windows, which is the
    # only platform this tool can do anything on.
    #
    # Removing it would mean dropping eframe's `wayland` feature, which would
    # make a Linux build fall back to X11 only. That is a real regression to
    # silence a maintenance notice in a crate we never call.
    #
    # Revisit if it is ever reclassified as a vulnerability, or if winit drops
    # the dependency.
    "RUSTSEC-2026-0192",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    # Boost Software License 1.0. OSI-approved and permissive, and the one
    # clause that matters for a shipped binary is explicit: the notice "need not
    # appear in machine-executable object code generated by a source language
    # processor". Nothing to bundle, unlike the fonts (see
    # THIRD-PARTY-NOTICES.md and Settings -> About -> Licences).
    #
    # Arrives via `clipboard-win` and `error-code`, both under
    # `arboard` -> `egui-winit` -> `eframe`: this is the Windows clipboard
    # implementation, so it is not an optional corner of the graph.
    "BSL-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
